qdrant:
  url: http://localhost:6333
  collection: chunks

llm:
  base_url: http://localhost:8000/v1
  model: llm   # --served-model-name in docker-compose.yml
  tokenizer: Qwen/Qwen2.5-7B-Instruct-AWQ   # for the prompt token budget
  context_window: 8192   # --max-model-len in docker-compose.yml
  max_tokens: 512        # answer length; reserved out of the context window
  temperature: 0.1
  history_turns: 6       # number of the most recent messages (question or answer) used for condensation and the prompt

models:
  embedder: BAAI/bge-m3
  reranker: BAAI/bge-reranker-v2-m3

chunking:
  max_tokens: 300
  overlap: 0.15

# Hybrid search: dense (bge-m3) + sparse (BM25), both ACL-filtered, fused with RRF
retrieval:
  rrf_k: 60          # RRF score = sum of w / (k + rank); larger k flattens the gap between top ranks
  rrf_weights: {dense: 1.0, sparse: 1.0}   # w per branch; raise one to trust that branch more
  candidates: 50     # per-branch top-k, and fused top-k sent to the reranker

# Cross-encoder reranking + confidence gate
rerank:
  top_k: 20              # keep the best N of the fused candidates for post-ranking
  gate_threshold: -2.0   # raw cross-encoder logit; best surviving chunk below -> "not found", no LLM call
                         # calibrated on the golden set: blocks all unanswerable/ACL questions, passes ~97% answerable

# Business signals on top of relevance:
#   final = minmax(ce) + w_freshness * freshness + w_authority * authority - w_dup * similarity_to_already_picked
# Weights are small on purpose: they reorder near-ties but can't lift an off-topic chunk (minmax(ce) spans 0..1 over the candidates)
postrank:
  final_k: 8             # chunks sent to the LLM
  max_per_doc: 2         # so one long document can't take every slot
  w_freshness: 0.05      # max bonus for a just-updated doc
  w_authority: 0.1       # max bonus for an official doc
  w_dup: 0.3             # MMR penalty per unit of cosine similarity to a chunk that was already picked
  dup_threshold: 0.95    # cosine; at or above -> dropped as a near-duplicate
  half_life_days: {confluence: 730, wiki: 730, gdrive: 365, ticket: 90, slack: 30}   # freshness halves after this age
  authority_prior: {official: 1.0, verified: 0.7, informal: 0.0}                     # multiplied by w_authority

# Phase 9: fine-tune the dense bi-encoder with symmetric InfoNCE + mined hard negatives (rag train).
# Afterwards set models.embedder to output_dir and re-index: rag ingest --reset
train:
  base_model: BAAI/bge-m3
  output_dir: models/bge-m3-infonce
  examples_per_source: 20000   # SQuAD, SberQuAD, MIRACL en, MIRACL ru (MIRACL has fewer)
  mine_top_k: 30               # hard negative = a random non-gold paragraph from the base model's top-k
  batch_size: 32               # queries per step; each brings a positive and a hard negative
  epochs: 1
  lr: 1.0e-5
  temperature_lr: 1.0e-3       # log-temperature is one scalar; at the model's lr it would barely move
  init_temperature: 0.07
  warmup: 0.1                  # share of steps with a linearly rising lr
  max_seq_length: 256          # tokens; corpus chunks are <= 300 embedder tokens, most far shorter
  gradient_checkpointing: true # recompute activations in backward: less memory, ~20-30% slower
  seed: 0
