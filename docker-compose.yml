services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  vllm:
    image: vllm/vllm-openai:v0.8.5
    runtime: nvidia
    ipc: host
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    # gpu-memory-utilization leaves ~9 GB of the 24 GB for the embedder and reranker on the host
    command: >
      --model ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      --served-model-name llm
      --max-model-len 8192
      --gpu-memory-utilization 0.6
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  qdrant_data:
